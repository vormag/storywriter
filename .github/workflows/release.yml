name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storywriter-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Choose version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose next minor version
        id: version
        shell: bash
        run: |
          latest_version="$(git tag --list \
            | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
            | sort -V \
            | tail -n 1)"

          if [[ -z "$latest_version" ]]; then
            next_version="1.0.0"
          else
            IFS=. read -r major minor _patch <<< "$latest_version"
            next_version="${major}.$((10#$minor + 1)).0"
          fi

          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"
          echo "Building Storywriter $next_version"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            command: dist:win
            artifact: storywriter-windows
            files: dist/*.exe
          - label: macOS ARM
            os: macos-14
            command: dist:mac:arm
            artifact: storywriter-macos-arm
            files: |
              dist/*.dmg
              dist/*.zip
          - label: macOS Universal
            os: macos-14
            command: dist:mac:universal
            artifact: storywriter-macos-universal
            files: |
              dist/*.dmg
              dist/*.zip
          - label: Linux
            os: ubuntu-latest
            command: dist:linux
            artifact: storywriter-linux
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Package application
        run: npm run ${{ matrix.command }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish ${{ needs.prepare.outputs.tag }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          gh release create "$RELEASE_TAG" release/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "Storywriter $RELEASE_VERSION"
          --generate-notes
